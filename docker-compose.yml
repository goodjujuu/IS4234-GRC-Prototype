# Placeholder — fill in once backend/ and frontend/ have a real stack.
# Mirrors the group's other NUS project (is4228), which ships a Docker image
# for offline/reproducible deployment alongside a cloud deploy script.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
